<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minimal Counter</title>
    <meta
      name="description"
      content="Un contatore minimale, veloce e accessibile." />
    <meta name="theme-color" content="#f5f5f5" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <script type="module" src="./script/script.js"></script>
  </head>
  <body>
    <main>
      <h1 class="title"><span>Minimal</span><span>Counter</span></h1>
      <div class="counter-container">
        <div class="displayed-number">
          <span id="number" aria-live="polite" aria-atomic="true">0</span>
        </div>
        <div class="buttons-container">
          <div class="buttons-top">
            <button class="button" id="decrement" aria-label="Decrementa">
              -
            </button>
            <button class="button" id="increment" aria-label="Incrementa">
              +
            </button>
          </div>
          <button class="button" id="reset">Reset</button>
        </div>
      </div>
    </main>
  </body>
</html>
